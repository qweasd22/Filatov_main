{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Удаление врача</h2>
    <p>Вы уверены, что хотите удалить врача {{ object }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'doctor_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
