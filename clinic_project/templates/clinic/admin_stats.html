{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Статистика клиники</h2>
    
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Всего пациентов</h5>
                    <p class="display-4">{{ stats.total_patients }}</p>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-4">
            <div class="card shadow text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">Всего обращений</h5>
                    <p class="display-4">{{ stats.total_visits }}</p>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-4">
            <div class="card shadow text-white bg-info">
                <div class="card-body">
                    <h5 class="card-title">Общая выручка</h5>
                    <p class="display-4">{{ stats.total_revenue }} руб.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
