{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">
        {% if object %}Редактирование услуги{% else %}Добавление новой услуги{% endif %}
    </h2>
    
    <div class="card shadow">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Название услуги</label>
                    {{ form.name }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Стоимость</label>
                    {{ form.cost }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    {{ form.description }}
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        {% if object %}Сохранить{% else %}Добавить{% endif %}
                    </button>
                    <a href="{% url 'service_list' %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
