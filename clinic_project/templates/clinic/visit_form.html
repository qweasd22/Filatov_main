{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Создать обращение</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.patient }}
        <div class="mb-3">
            <label class="form-label">Фамилия</label>
            {{ form.last_name }}
        </div>
        <div class="mb-3">
            <label class="form-label">Имя</label>
            {{ form.first_name }}
        </div>
        <div class="mb-3">
            <label class="form-label">Отчество</label>
            {{ form.middle_name }}
        </div>
        <div class="mb-3">
            <label class="form-label">Врач</label>
            {{ form.doctor }}
        </div>
        <div class="mb-3">
            <label class="form-label">Дата</label>
            {{ form.date }}
        </div>
        <div class="mb-3">
            <label class="form-label">Диагноз</label>
            {{ form.diagnosis }}
        </div>
        <div class="mb-3">
            <label class="form-label">Услуги</label>
            <div class="service-checkboxes">
                {{ form.services }}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Создать</button>
    </form>
</div>
{% endblock %}
